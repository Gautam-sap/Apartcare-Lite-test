[project]
name = "apartcare-lite-api"
version = "6.5.13"
description = "ApartCare Lite FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "vercel>=0.5.0,<1.0",
]

[tool.vercel]
entrypoint = "app.main:app"
